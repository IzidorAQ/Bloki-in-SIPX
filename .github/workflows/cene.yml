name: Posodobi cene

# Cene za naslednji dan se objavijo okoli 13:00 po srednjeevropskem času.
# Časi spodaj so v UTC, zato poskusimo večkrat, da pokrijemo tudi zamude in zimski čas.
on:
  schedule:
    - cron: "10 11 * * *"   # ~13:10 poletni / 12:10 zimski
    - cron: "10 12 * * *"
    - cron: "10 13 * * *"
    - cron: "10 15 * * *"
    - cron: "10 18 * * *"
    - cron: "10 5  * * *"   # jutranji poskus, če je čez noč kaj manjkalo
  workflow_dispatch:        # gumb za ročni zagon

permissions:
  contents: write

concurrency:
  group: cene
  cancel-in-progress: false

jobs:
  cene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # setup-node ni potreben: ubuntu-latest ima Node že nameščen.
      # S tem odpade tudi opozorilo o zastarelem Node.js 20 pri tem dejanju.
      - name: Pridobi cene
        id: fetch
        env:
          EUENERGY_TOKEN: ${{ secrets.EUENERGY_TOKEN }}
        run: node fetch-cene.js

      - name: Shrani, če so nove
        env:
          EUENERGY_TOKEN: ${{ secrets.EUENERGY_TOKEN }}
        run: |
          BR="${{ github.ref_name }}"
          git config user.name "cene-bot"
          git config user.email "actions@github.com"
          for i in 1 2 3; do
            if [ -z "$(git status --porcelain cene.json)" ]; then
              echo "Ni sprememb."
              exit 0
            fi
            git add cene.json
            git commit -q -m "cene: $(date -u +%Y-%m-%d\ %H:%M) UTC"
            if git push origin HEAD:"$BR"; then
              echo "Shranjeno."
              exit 0
            fi
            # Medtem se je daljava premaknila (npr. rocno nalozena datoteka).
            # Odvrzemo svoj commit, se poravnamo z daljavo in cene zgradimo znova
            # nad najnovejso razlicico, da se nobena sprememba ne izgubi.
            echo "Potisk zavrnjen (poskus $i). Poravnavam z daljavo in gradim znova."
            git reset --hard -q HEAD~1
            git fetch -q origin "$BR"
            git reset --hard -q "origin/$BR"
            node fetch-cene.js
            sleep 3
          done
          echo "Potisk ni uspel niti po treh poskusih."
          exit 1
